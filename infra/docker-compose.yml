# TODO: Add the remaining database configuration here.
# The `model` service below serves the trained CNN from pipeline/ over
# FastAPI, on port 8001.
#
# The trained weights are baked into the model image at BUILD time (see
# pipeline/Dockerfile), not mounted in at runtime. pipeline/models/ is
# committed to git, so the normal flow is just:
#   1. `docker compose build model` (or `up --build`) bakes in whatever
#      model is currently committed in pipeline/models/. No training or
#      GPU needed on whatever machine is doing the build/run.
#   2. Producing a NEW model instead: run `python pipeline/train.py`
#      locally, `git add pipeline/models` + commit, THEN `docker compose
#      build model` again to bake in the new weights.

services:
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://nlhpnxefxxcuiglcjrkt.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1jfrtErG_F-Hsa-2hGkuNg_F3EeW7Hv
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_URL=http://model:8001
      - SUPABASE_JWKS_URL=https://nlhpnxefxxcuiglcjrkt.supabase.co/auth/v1/.well-known/jwks.json
    depends_on:
      model:
        condition: service_healthy

  model:
    build:
      context: ../pipeline
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
