# TODO: Add the remaining database configuration here.
# The `model` service below serves the trained CNN from pipeline/ over
# FastAPI, on port 8001.
#
# The trained weights are baked into the model image at BUILD time (see
# pipeline/Dockerfile), not mounted in at runtime. pipeline/models/ is
# committed to git, so the normal flow is just:
#   1. `docker compose build model` (or `up --build`) bakes in whatever
#      model is currently committed in pipeline/models/. No training or
#      GPU needed on whatever machine is doing the build/run.
#   2. Producing a NEW model instead: run `python pipeline/train.py`
#      locally, `git add pipeline/models` + commit, THEN `docker compose
#      build model` again to bake in the new weights.

services:
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://nlhpnxefxxcuiglcjrkt.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1jfrtErG_F-Hsa-2hGkuNg_F3EeW7Hv
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    # Context is the repo root so the `database` package ships with the backend.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # --- Non-secret. Safe to commit: public endpoints and identifiers. ---
      - MODEL_URL=http://model:8001
      - SUPABASE_URL=https://nlhpnxefxxcuiglcjrkt.supabase.co
      - SUPABASE_JWKS_URL=https://nlhpnxefxxcuiglcjrkt.supabase.co/auth/v1/.well-known/jwks.json
      - R2_BUCKET_NAME=brain
      # R2 public dev domain — serves the `brain` bucket from its root, so no
      # bucket segment in the path (see _public_url in main.py).
      - NEXT_PUBLIC_IMAGE_DOMAIN=https://pub-306a1d84c120450585c84567cbfc321c.r2.dev
      #
      # --- Secrets. THIS FILE IS COMMITTED TO GITHUB: never inline a value
      # here. They are read from infra/.env, which is gitignored. `:?` makes
      # compose refuse to start with a clear message rather than booting a
      # half-working stack that silently drops every saved prediction.
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:?not set — copy infra/.env.example to infra/.env and fill it in}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:?not set — copy infra/.env.example to infra/.env and fill it in}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?not set — copy infra/.env.example to infra/.env and fill it in}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?not set — copy infra/.env.example to infra/.env and fill it in}
    depends_on:
      model:
        condition: service_healthy

  model:
    build:
      context: ../pipeline
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
