[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "pillow==12.3.0",
    "pydantic==2.7.4",
    "python-multipart==0.0.9",
    "scikit-learn==1.7.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "uvicorn[standard]==0.30.1",
]

# Test-only deps, kept out of requirements.txt/the Dockerfile on purpose --
# the running service doesn't need pytest, and the Docker image only ever
# installs from requirements.txt (see Dockerfile), so this group never
# bloats it. Install with `pip install -e ".[test]"` or `pip install pytest httpx`.
[project.optional-dependencies]
test = ["pytest", "httpx"]
